<h2><p style="color: red; size: 40px;">Car Insaurance Information</p></h2>


<table class="table table-bordered">
    <thead>
      <tr>
        <th>username</th>
        <th>id</th>
        <th>title</th>
        <th>Body</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let x of DataStorableVariable ">
        <td>{{x.userId}}</td>
        <td>{{x.id}}</td>
        <td>{{x.title}}</td>
        <td>{{x.body}}</td>

      </tr>
    </tbody>
  </table>
