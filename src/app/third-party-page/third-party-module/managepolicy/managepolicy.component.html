<p>Please fill in this form to Apply ACKOCar Insuarance.</p>
<div class="container">
        <form class="modal-content" #userForm="ngForm" (ngSubmit)="submituserdata(userForm)">

                <input type="hidden" name="id" #id="ngModel" ngModel [(ngModel)]="idd">
                <hr>
                <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" name="name" class="form-control" #pass="ngModel" ngModel [(ngModel)]="nm">
                </div>


                <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" name="address" class="form-control" #pass="ngModel" ngModel [(ngModel)]="ad">
                </div>


                <div class="form-group"> <label for="phone">Phone Number</label> <input type="text" name="phone"
                                class="form-control" #pass="ngModel" ngModel [(ngModel)]="ph"> </div>


                
                <div class="form-group"> <label for="ssc">Company Name</label> <input type="text" name="ssc"
                                class="form-control" #pass="ngModel" ngModel [(ngModel)]="ss"> </div>


                <div class="form-group"> <label for="hsc">Car Model</label> <input type="text" name="hsc" class="form-control"
                                #pass="ngModel" ngModel [(ngModel)]="hs"> </div> <br>


                <div class="clearfix">
                        
                        <button type="submit" class="btn btn-info">submit</button> &nbsp;
                        <button class="btn btn-info" (click)="onupdatebtn(userForm)">Update</button>
                </div>
        </form>
        <table class="table table-responsive">
                <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Phone Number</th>
                        <th>Company Name</th>
                        <th>Car Model</th>
                        <th> action</th>
                        <th> action</th>
                </tr>
                <tr *ngFor="let dt of userdata">
                        <td>{{dt.name}}</td>
                        <td>{{dt.address}}</td>
                        <td>{{dt.phone}}</td>
                        <td>{{dt.ssc}}</td>
                        <td>{{dt.hsc}}</td>
                        <td><button class="btn btn-danger" (click)="ondelete(dt)">Delete</button></td>
                        <td><button class="btn btn-info" (click)="onupdate(dt)">Update</button></td>

                </tr>

        </table>
</div>

<script> // Get the modal var modal = document.getElementById('id01'); // When the user clicks anywhere outside of the modal, close it window.onclick = function(event) { if (event.target == modal) { modal.style.display = "none"; } } </script>
